target-version = "py312"

exclude = ["**/migrations", "node_modules", "docs"]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Imports documentados como intencionales: esos modelos tienen PK compuesta y
# no se registran en el admin (ver apps/projects/admin.py).
"apps/projects/admin.py" = ["F401"]
# Los settings heredan de base.py con star import.
"config/settings/dev.py" = ["F403"]
"config/settings/test.py" = ["F405"]
