<div class="flex flex-wrap gap-2">
    {% for group, options, index in widget.optgroups %}
        {% for option in options %}
            <label for="{{ option.attrs.id }}" class="cursor-pointer select-none">
                <input type="checkbox" id="{{ option.attrs.id }}" name="{{ option.name }}"
                       value="{{ option.value }}"
                       class="peer sr-only"{% if option.selected %} checked{% endif %}>
                <span class="inline-flex items-center gap-1.5 rounded-full border border-violet-200 bg-violet-100 px-3.5 py-1.5 text-sm font-semibold text-violet-700 transition-colors peer-checked:border-violet-700 peer-checked:bg-violet-700 peer-checked:text-white peer-checked:[&>svg]:block">
                    {{ option.label }}
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="hidden h-3.5 w-3.5 text-white">
                        <path d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z"/>
                    </svg>
                </span>
            </label>
        {% endfor %}
    {% endfor %}
</div>
