{% comment %}
Barra de progreso horizontal pill.
Uso: {% include "core/_factor_bar.html" with pct=92 track_class="bg-violet-100" fill_class="bg-violet-700" %}
{% endcomment %}
<div class="h-2 overflow-hidden rounded-full {{ track_class|default:'bg-violet-track' }}" aria-hidden="true">
    <div class="h-full rounded-full {{ fill_class|default:'bg-gradient-to-r from-violet-fill-start to-violet-fill-end' }}"
         style="width: {{ pct }}%;"></div>
</div>
