{% extends "base.html" %}

{% block title %}Crear un nuevo proyecto — DevMatch{% endblock %}

{% block content %}
<div class="fixed inset-0 z-[9999] flex items-center justify-center bg-slate-900/40 backdrop-blur-md p-4 font-montserrat overflow-y-auto">
    
    <div class="relative w-full max-w-4xl bg-white rounded-[28px] shadow-2xl p-8 md:p-10 text-slate-800 space-y-6 my-auto max-h-[92vh] overflow-y-auto">
        
        <!-- Botón X de cerrar (Redirige a la lista) -->
        <a href="{% url 'core:home' %}" class="absolute top-6 right-6 text-slate-400 hover:text-slate-600 transition-colors p-1" aria-label="Cerrar modal">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </a>

        <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Crear un nuevo proyecto</h2>

        <form method="post" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}

            <div class="space-y-1.5">
                <label for="id_nombre" class="block text-xs font-semibold text-slate-700">Nombre del proyecto</label>
                <div class="relative">
                    <input type="text" 
                           name="nombre"
                           id="id_nombre"
                           maxlength="150"
                           placeholder="Ingresa el nombre de tu proyecto..." 
                           class="w-full h-11 px-4 rounded-xl bg-slate-50/80 border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-violet-600 focus:bg-white transition-colors"
                           required>
                </div>
                <div class="text-right text-[11px] text-slate-400">0/150</div>
            </div>

            <div class="space-y-1.5">
                <label for="id_descripcion" class="block text-xs font-semibold text-slate-700">Descripción</label>
                <textarea name="descripcion"
                          id="id_descripcion"
                          rows="4" 
                          placeholder="Describe tu propuesta, el problema que resuelve, sus características o el alcance general del proyecto..." 
                          class="w-full p-4 rounded-xl bg-slate-50/80 border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-violet-600 focus:bg-white transition-colors resize-none"
                          required></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-1">
                
                <div class="space-y-2">
                    <label class="block text-xs font-semibold text-slate-700">Logo del proyecto</label>
                    <label for="id_logo" class="flex flex-col items-center justify-center p-8 rounded-2xl border-2 border-dashed border-slate-200 bg-slate-50/40 hover:bg-slate-100/60 transition-colors cursor-pointer text-center group">
                        <div class="mb-3 text-violet-700 group-hover:scale-110 transition-transform">
                            <svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                            </svg>
                        </div>
                        <p class="text-xs text-slate-600 font-medium">Haz click para seleccionar una imagen</p>
                        <p class="text-[10px] text-slate-400 mt-1">Formatos: JPG, PNG, WEBP</p>
                        <input type="file" name="logo" id="id_logo" class="hidden" accept="image/*">
                    </label>
                </div>

                <div class="space-y-2">
                    <label class="block text-xs font-semibold text-slate-700">Imágenes del proyecto <span class="font-normal italic text-slate-400">(opcional)</span></label>
                    <label for="id_imagenes" class="flex flex-col items-center justify-center p-8 rounded-2xl border-2 border-dashed border-slate-200 bg-slate-50/40 hover:bg-slate-100/60 transition-colors cursor-pointer text-center group">
                        <div class="mb-3 text-violet-700 group-hover:scale-110 transition-transform">
                            <svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                            </svg>
                        </div>
                        <p class="text-xs text-slate-600 font-medium">Haz click para seleccionar una imagen</p>
                        <p class="text-[10px] text-slate-400 mt-1">Formatos: JPG, PNG, WEBP</p>
                        <input type="file" name="imagenes" id="id_imagenes" class="hidden" accept="image/*" multiple>
                    </label>
                </div>

            </div>

            <div class="flex items-center justify-end gap-3 pt-4">
                <a href="{% url 'core:home' %}" 
                   class="px-7 py-2.5 rounded-full border border-violet-200 text-xs font-bold text-violet-900 bg-violet-50/50 hover:bg-violet-100 transition-colors">
                    Cancelar
                </a>
                <button type="submit" 
                        class="px-7 py-2.5 rounded-full text-xs font-bold text-white bg-violet-700 hover:bg-violet-800 transition-colors shadow-sm">
                    Crear proyecto
                </button>
            </div>
        </form>

    </div>
</div>
{% endblock content %}
