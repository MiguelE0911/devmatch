{% if messages %}
    <div class="space-y-2">
        {% for message in messages %}
            {% if message.tags == "success" %}
                <div data-alert data-autocierre="true" role="status"
                     class="relative flex items-start gap-3 rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 pr-10 text-sm text-emerald-700 transition-all duration-500">
                    {{ message }}
                    <button type="button" data-alert-cerrar aria-label="Cerrar aviso"
                            class="absolute right-2 top-2 rounded-full p-1 text-current opacity-50 transition-opacity hover:opacity-100">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-3.5 w-3.5">
                            <path d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z"/>
                        </svg>
                    </button>
                </div>
            {% elif message.tags == "error" %}
                <div data-alert data-autocierre="false" role="alert"
                     class="relative flex items-start gap-3 rounded-lg border border-red-200 bg-red-50 px-4 py-3 pr-10 text-sm text-red-700 transition-all duration-500">
                    {{ message }}
                    <button type="button" data-alert-cerrar aria-label="Cerrar aviso"
                            class="absolute right-2 top-2 rounded-full p-1 text-current opacity-50 transition-opacity hover:opacity-100">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-3.5 w-3.5">
                            <path d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z"/>
                        </svg>
                    </button>
                </div>
            {% elif message.tags == "warning" %}
                <div data-alert data-autocierre="false" role="status"
                     class="relative flex items-start gap-3 rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 pr-10 text-sm text-amber-700 transition-all duration-500">
                    {{ message }}
                    <button type="button" data-alert-cerrar aria-label="Cerrar aviso"
                            class="absolute right-2 top-2 rounded-full p-1 text-current opacity-50 transition-opacity hover:opacity-100">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-3.5 w-3.5">
                            <path d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z"/>
                        </svg>
                    </button>
                </div>
            {% else %}
                <div data-alert data-autocierre="false" role="status"
                     class="relative flex items-start gap-3 rounded-lg border border-slate-200 bg-slate-100 px-4 py-3 pr-10 text-sm text-slate-700 transition-all duration-500">
                    {{ message }}
                    <button type="button" data-alert-cerrar aria-label="Cerrar aviso"
                            class="absolute right-2 top-2 rounded-full p-1 text-current opacity-50 transition-opacity hover:opacity-100">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-3.5 w-3.5">
                            <path d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z"/>
                        </svg>
                    </button>
                </div>
            {% endif %}
        {% endfor %}
    </div>
{% endif %}

<script>
    (function () {
        function ocultar(aviso) {
            aviso.classList.add("opacity-0", "translate-y-1");
            setTimeout(function () { aviso.remove(); }, 600);
        }
        document.querySelectorAll("[data-alert]").forEach(function (aviso) {
            var cerrar = aviso.querySelector("[data-alert-cerrar]");
            if (cerrar) {
                cerrar.addEventListener("click", function () { ocultar(aviso); });
            }
            if (aviso.dataset.autocierre === "true") {
                setTimeout(function () { ocultar(aviso); }, 4000);
            }
        });
    })();
</script>
